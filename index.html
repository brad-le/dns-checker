<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudflare DNS Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #5b5d60;
  --panel: #1a2029;
  --panel-2: #232b36;
  --border: #2d3744;
  --text: #e6edf3;
  --text-dim: #8b96a3;
  --accent: #31bff7;
  --ok: #3fb950;
  --fail: #f85149;
  --warn: #d29922;
  --neutral: #6e7681;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px;
  line-height: 1.5;
}

.container {
  max-width: 980px;
  margin: 0 auto;
}

header {
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}

h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 12px;
}

h1::before {
  content: '';
  width: 8px;
  height: 22px;
  background: var(--accent);
  border-radius: 2px;
}

.subtitle {
  color: var(--text-dim);
  font-size: 13px;
  margin-top: 6px;
  margin-left: 20px;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

input[type="text"] {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s;
}

input[type="text"]:focus {
  border-color: var(--accent);
}

button {
  background: var(--accent);
  color: #0f1419;
  border: none;
  padding: 12px 24px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: opacity 0.15s;
}

button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.results {
  display: none;
}

.results.active { display: block; }

.domain-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  padding: 14px 18px;
  background: var(--panel-2);
  border-radius: 6px;
  margin-bottom: 18px;
  border-left: 3px solid var(--accent);
}

.section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

.section-header {
  padding: 14px 18px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.section-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: 0.05em;
}

.section-status.complete {
  background: rgba(63, 185, 80, 0.15);
  color: var(--ok);
  border: 1px solid rgba(63, 185, 80, 0.3);
}

.section-status.incomplete {
  background: rgba(248, 81, 73, 0.15);
  color: var(--fail);
  border: 1px solid rgba(248, 81, 73, 0.3);
}

.section-body {
  padding: 8px 0;
}

.check {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: start;
}

.check:last-child { border-bottom: none; }

.check-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.check-type {
  background: var(--panel-2);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.check-tag {
  font-size: 10px;
  color: var(--neutral);
  font-style: italic;
}

.check-name {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  word-break: break-all;
  font-size: 13px;
}

.check-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
  margin-top: 6px;
  padding-left: 14px;
  border-left: 2px solid var(--border);
  word-break: break-all;
}

.check-value.none {
  color: var(--neutral);
  font-style: italic;
}

.check-value .ip-tag {
  color: var(--neutral);
  font-size: 10px;
  margin-left: 6px;
  font-style: italic;
}

.check-value .ip-tag.unexpected { color: var(--warn); }
.check-value .missing { color: var(--fail); }

.expected {
  font-size: 11px;
  color: var(--neutral);
  margin-top: 4px;
  padding-left: 14px;
  font-family: 'JetBrains Mono', monospace;
}

.status-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 3px;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.status-pill.ok {
  background: rgba(63, 185, 80, 0.15);
  color: var(--ok);
}

.status-pill.fail {
  background: rgba(248, 81, 73, 0.15);
  color: var(--fail);
}

.status-pill.loading {
  background: var(--panel-2);
  color: var(--text-dim);
}

.context {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
}

.context-row {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 12px;
  padding: 4px 0;
}

.context-label {
  color: var(--neutral);
}

.context-value {
  color: var(--text);
  word-break: break-all;
}

.error-banner {
  background: rgba(248, 81, 73, 0.1);
  border: 1px solid rgba(248, 81, 73, 0.3);
  color: var(--fail);
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 13px;
}

.spinner {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

footer {
  margin-top: 32px;
  text-align: center;
  color: var(--neutral);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Cloudflare DNS Checker</h1>
  </header>

  <div class="input-row">
    <input type="text" id="domainInput" placeholder="example.com  (or  https://example.com/)" autofocus>
    <button id="checkBtn">Check</button>
  </div>

  <div class="results" id="results"></div>

  <footer>
    DNS queries via Cloudflare DoH (1.1.1.1) &middot; client-side only
  </footer>
</div>

<script>
const EXPECTED_A_RECORDS = new Set(["104.16.85.56", "104.16.86.56"]);
const EXPECTED_WWW_CNAME = "proxy-web.liveeditaurora.com";
const EXPECTED_DCV_TARGET = "ea56cdc951f52bb8.dcv.cloudflare.com";

const DNS_HOSTS = [
  ["domaincontrol.com", "GoDaddy"],
  ["googledomains.com", "Google Cloud DNS"],
  ["cloudflare.com", "Cloudflare"],
  ["worldnic.com", "Network Solutions"],
  ["registrar-servers.com", "Namecheap"],
  ["hover.com", "Hover"],
  ["ui-dns", "IONOS (1&1)"],
  ["1and1.com", "IONOS (1&1)"],
  ["turbify.com", "Turbify"],
  ["namebrightdns.com", "NameBright"],
  ["domainpeople.com", "DomainPeople"],
  ["meganameservers", "Mega Nameservers / Heart Internet"],
  ["systemdns.com", "SystemDNS (Register.com)"],
  ["topdns.com", "TopDNS / Hosting Concepts"],
  ["nsone.net", "NS1 / Squarespace"],
  ["hostgator.com", "HostGator"],
  ["justhost.com", "Bluehost / JustHost"],
  ["pipedns.com", "pipedns"],
  ["drtel.net", "DRtel (Dickey Rural Networks)"],
  ["franticllc.com", "Frantic LLC"],
];

const RTYPE_MAP = { A: 1, CNAME: 5, TXT: 16, NS: 2 };

function cleanDomain(raw) {
  raw = raw.trim();
  for (const prefix of ["https://", "http://"]) {
    if (raw.toLowerCase().startsWith(prefix)) raw = raw.slice(prefix.length);
  }
  return raw.split("/")[0].trim().toLowerCase();
}

async function dohLookup(name, rtype) {
  const url = `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${rtype}`;
  try {
    const res = await fetch(url, { headers: { Accept: "application/dns-json" } });
    if (!res.ok) return { values: [`ERROR: HTTP ${res.status}`], error: true };
    const data = await res.json();
    // Status 3 = NXDOMAIN, 0 = NOERROR. NoAnswer = no Answer field.
    if (!data.Answer) return { values: [], error: false };
    const wanted = RTYPE_MAP[rtype];
    const out = [];
    for (const a of data.Answer) {
      if (a.type !== wanted) continue;
      let v = a.data;
      if (rtype === "TXT") {
        v = v.replace(/^"(.*)"$/, "$1");
      } else if (rtype === "CNAME" || rtype === "NS") {
        v = v.replace(/\.$/, "");
      }
      out.push(v);
    }
    return { values: out, error: false };
  } catch (e) {
    return { values: [`ERROR: ${e.message}`], error: true };
  }
}

function inferDnsHost(nameservers) {
  if (!nameservers || !nameservers.length) return "unknown";
  const joined = nameservers.join(" ").toLowerCase();
  for (const [needle, label] of DNS_HOSTS) {
    if (joined.includes(needle)) return label;
  }
  return "unknown";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtValue(values) {
  if (!values || !values.length) return '<span class="none">(none)</span>';
  return values.map(escapeHtml).join("; ");
}

function statusPill(ok) {
  return ok
    ? '<span class="status-pill ok">OK</span>'
    : '<span class="status-pill fail">FAIL</span>';
}

function checkRow(type, name, tag, valueHtml, statusHtml, expectedHtml = "") {
  return `
    <div class="check">
      <div>
        <div class="check-label">
          <span class="check-type">${type}</span>
          <span class="check-tag">[${tag}]</span>
        </div>
        <div class="check-name">${escapeHtml(name)}</div>
        <div class="check-value">${valueHtml}</div>
        ${expectedHtml ? `<div class="expected">expected: ${expectedHtml}</div>` : ""}
      </div>
      <div>${statusHtml}</div>
    </div>
  `;
}

async function runCheck(domain) {
  const results = document.getElementById("results");
  results.classList.add("active");
  results.innerHTML = `
    <div class="domain-header">${escapeHtml(domain)} <span class="spinner" style="margin-left: 10px;"></span></div>
    <div style="color: var(--text-dim); font-size: 13px; padding: 8px 4px;">Running DNS lookups...</div>
  `;

  const lookups = await Promise.all([
    dohLookup(`cf-custom-hostname.${domain}`, "TXT"),       // 0 - no underscore
    dohLookup(`_cf-custom-hostname.${domain}`, "TXT"),      // 1 - correct
    dohLookup(`_cf-custom-hostname.${domain}.${domain}`, "TXT"), // 2 - doubled
    dohLookup(`acme-challenge.${domain}`, "CNAME"),         // 3 - no underscore
    dohLookup(`_acme-challenge.${domain}`, "CNAME"),        // 4 - correct
    dohLookup(`_acme-challenge.${domain}.${domain}`, "CNAME"), // 5 - doubled
    dohLookup(`www.${domain}`, "CNAME"),                    // 6
    dohLookup(domain, "A"),                                 // 7
    dohLookup(domain, "NS"),                                // 8
  ]);

  const [
    txtNoUnder, txtCorrect, txtDoubled,
    cnameNoUnder, cnameCorrect, cnameDoubled,
    wwwCname, rootA, ns
  ] = lookups;

  // Phase 1 validations
  const txtCorrectOk = txtCorrect.values.length > 0 && !txtCorrect.values.some(v => v.startsWith("ERROR"));
  const txtNoUnderOk = txtNoUnder.values.length === 0;
  const txtDoubledOk = txtDoubled.values.length === 0;

  const cnameCorrectOk = cnameCorrect.values.length > 0 && cnameCorrect.values.some(v => v.includes(EXPECTED_DCV_TARGET));
  const cnameNoUnderOk = cnameNoUnder.values.length === 0;
  const cnameDoubledOk = cnameDoubled.values.length === 0;

  const phase1Ok = txtCorrectOk && txtNoUnderOk && txtDoubledOk && cnameCorrectOk && cnameNoUnderOk && cnameDoubledOk;

  // Phase 2 validations
  const aValues = rootA.values.filter(v => !v.startsWith("ERROR"));
  const aSet = new Set(aValues);
  const aMissing = [...EXPECTED_A_RECORDS].filter(ip => !aSet.has(ip));
  const aExtra = [...aSet].filter(ip => !EXPECTED_A_RECORDS.has(ip));
  const wwwOk = wwwCname.values.length > 0 && wwwCname.values.some(v => v.toLowerCase() === EXPECTED_WWW_CNAME);
  const phase2Ok = aMissing.length === 0 && aExtra.length === 0 && wwwOk;

  // Build A record display
  let aDisplayHtml = "";
  if (aValues.length === 0) {
    aDisplayHtml = '<span class="none">(none)</span>';
    for (const ip of [...EXPECTED_A_RECORDS].sort()) {
      aDisplayHtml += `<br><span class="missing">(missing) ${escapeHtml(ip)}</span>`;
    }
  } else {
    const parts = [];
    for (const ip of [...aSet].sort()) {
      const tag = EXPECTED_A_RECORDS.has(ip) ? "expected" : "unexpected";
      const cls = EXPECTED_A_RECORDS.has(ip) ? "" : "unexpected";
      parts.push(`${escapeHtml(ip)} <span class="ip-tag ${cls}">[${tag}]</span>`);
    }
    for (const ip of aMissing.sort()) {
      parts.push(`<span class="missing">(missing) ${escapeHtml(ip)}</span>`);
    }
    aDisplayHtml = parts.join("<br>");
  }

  // Phase 2 notes
  const phase2Notes = [];
  if (aMissing.length) phase2Notes.push(`missing A: ${aMissing.join(", ")}`);
  if (aExtra.length) phase2Notes.push(`unexpected A: ${aExtra.join(", ")}`);
  if (!wwwOk) phase2Notes.push("www CNAME wrong target");

  const html = `
    <div class="domain-header">${escapeHtml(domain)}</div>

    <div class="section">
      <div class="section-header">
        <span>Phase 1 &middot; Cloudflare custom hostname validation</span>
        <span class="section-status ${phase1Ok ? 'complete' : 'incomplete'}">${phase1Ok ? 'COMPLETE' : 'INCOMPLETE'}</span>
      </div>
      <div class="section-body">
        ${checkRow("TXT", `_cf-custom-hostname.${domain}`, "correct", fmtValue(txtCorrect.values), statusPill(txtCorrectOk))}
        ${checkRow("TXT", `cf-custom-hostname.${domain}`, "no underscore", fmtValue(txtNoUnder.values), statusPill(txtNoUnderOk))}
        ${checkRow("TXT", `_cf-custom-hostname.${domain}.${domain}`, "doubled", fmtValue(txtDoubled.values), statusPill(txtDoubledOk))}
        ${checkRow("CNAME", `_acme-challenge.${domain}`, "correct", fmtValue(cnameCorrect.values), statusPill(cnameCorrectOk), escapeHtml(EXPECTED_DCV_TARGET))}
        ${checkRow("CNAME", `acme-challenge.${domain}`, "no underscore", fmtValue(cnameNoUnder.values), statusPill(cnameNoUnderOk))}
        ${checkRow("CNAME", `_acme-challenge.${domain}.${domain}`, "doubled", fmtValue(cnameDoubled.values), statusPill(cnameDoubledOk))}
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>Phase 2 &middot; Cloudflare proxy cutover${phase2Notes.length ? ' &middot; ' + escapeHtml(phase2Notes.join("; ")) : ''}</span>
        <span class="section-status ${phase2Ok ? 'complete' : 'incomplete'}">${phase2Ok ? 'COMPLETE' : 'INCOMPLETE'}</span>
      </div>
      <div class="section-body">
        <div class="check">
          <div>
            <div class="check-label"><span class="check-type">A</span></div>
            <div class="check-name">${escapeHtml(domain)}</div>
            <div class="check-value">${aDisplayHtml}</div>
            <div class="expected">expected: ${[...EXPECTED_A_RECORDS].sort().join(", ")}</div>
          </div>
          <div>${statusPill(aMissing.length === 0 && aExtra.length === 0)}</div>
        </div>
        ${checkRow("CNAME", `www.${domain}`, "proxy", fmtValue(wwwCname.values), statusPill(wwwOk), escapeHtml(EXPECTED_WWW_CNAME))}
      </div>
    </div>

    <div class="context">
      <div class="context-row">
        <div class="context-label">NS</div>
        <div class="context-value">${ns.values.length ? ns.values.sort().map(escapeHtml).join(", ") : '<span style="color: var(--neutral);">(none)</span>'}</div>
      </div>
      <div class="context-row">
        <div class="context-label">DNS host</div>
        <div class="context-value">${escapeHtml(inferDnsHost(ns.values))}</div>
      </div>
    </div>
  `;

  results.innerHTML = html;
}

const input = document.getElementById("domainInput");
const btn = document.getElementById("checkBtn");

async function handleCheck() {
  const raw = input.value;
  const domain = cleanDomain(raw);
  if (!domain) {
    document.getElementById("results").innerHTML = '<div class="error-banner">Enter a domain to check.</div>';
    document.getElementById("results").classList.add("active");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Checking...";
  try {
    await runCheck(domain);
  } catch (e) {
    document.getElementById("results").innerHTML = `<div class="error-banner">Lookup failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Check";
  }
}

btn.addEventListener("click", handleCheck);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") handleCheck();
});
</script>
</body>
</html>
